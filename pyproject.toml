[project]
name = "automation-architect"
version = "0.1.0"
description = "AI agent that turns a plain-language automation request into an n8n workflow and a proposal."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk>=0.2.180",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
    "weasyprint>=70.0",
]

[project.scripts]
automation-architect = "automation_architect.bootstrap:serve"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM",
    "TID", "ARG", "PTH", "PL", "RUF", "S", "T20", "ANN",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
markers = [
    "integration: tests against real external services (deselected by default)",
]
